<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <!-- Bootstrap 5 CSS - Local -->
    <link href="vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container mt-4">
      <header class="text-center mb-4">
        <h1 class="display-4">Budget Tracker</h1>
        <p class="lead">Track your income and expenses with real-time visualization</p>
      </header>

      <main>
        <!-- Username Section -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">User Information</h5>
            <div class="mb-3">
              <label for="username" class="form-label">Username:</label>
              <input type="text" class="form-control" id="username" placeholder="Enter your username" />
              <div class="invalid-feedback" id="username-error"></div>
              <div class="valid-feedback" id="username-success"></div>
            </div>
            <button type="button" class="btn btn-primary" id="save-username">Save Username</button>
            <div id="username-display" class="mt-3"></div>
          </div>
        </div>

        <!-- Transaction Form -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Add Transaction</h5>
            <form id="transaction-form">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="description" class="form-label">Description:</label>
                  <input type="text" class="form-control" id="description" required placeholder="e.g., Salary, Groceries" />
                </div>
                <div class="col-md-3">
                  <label for="amount" class="form-label">Amount:</label>
                  <input type="number" class="form-control" id="amount" required placeholder="0.00" step="0.01" />
                </div>
                <div class="col-md-3">
                  <label for="type" class="form-label">Type:</label>
                  <select class="form-select" id="type" required>
                    <option value="">-- Select --</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-success">Add Transaction</button>
            </form>
          </div>
        </div>

        <!-- Budget Summary -->
        <div class="row mb-4">
          <div class="col-md-4">
            <div class="card text-white bg-success">
              <div class="card-body">
                <h5 class="card-title">Total Income</h5>
                <p class="card-text fs-3" id="total-income">$0.00</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-white bg-danger">
              <div class="card-body">
                <h5 class="card-title">Total Expenses</h5>
                <p class="card-text fs-3" id="total-expenses">$0.00</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-white bg-primary">
              <div class="card-body">
                <h5 class="card-title">Balance</h5>
                <p class="card-text fs-3" id="balance">$0.00</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Chart -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Budget Visualization</h5>
            <canvas id="budget-chart"></canvas>
          </div>
        </div>

        <!-- Transactions List -->
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Transaction History</h5>
            <div class="table-responsive">
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="transactions-list">
                  <tr>
                    <td colspan="4" class="text-center text-muted">No transactions yet</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>

      <footer class="text-center mt-4 mb-4">
        <p class="text-muted">&copy; 2026 Budget Tracker</p>
      </footer>
    </div>

    <!-- Bootstrap 5 JS - Local -->
    <script src="vendor/bootstrap.bundle.min.js"></script>
    <!-- Chart.js - Local -->
    <script src="vendor/chart.umd.js"></script>
    <script src="app.js"></script>
  </body>
</html>
